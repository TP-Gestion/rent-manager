<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Factura de alquiler</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f5f7; font-family:Arial, Helvetica, sans-serif; color:#1f2933;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7; padding:24px 0;">
        <tr>
            <td align="center">
                <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:8px; overflow:hidden; max-width:600px; width:100%;">
                    <tr>
                        <td style="background-color:#1f3a93; padding:24px 32px;">
                            <h1 style="margin:0; color:#ffffff; font-size:20px;">Factura de alquiler</h1>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:32px;">
                            <p style="margin:0 0 16px; font-size:15px;">
                                Hola <strong th:text="${tenantName}">Inquilino</strong>,
                            </p>
                            <p style="margin:0 0 16px; font-size:15px; line-height:1.5;">
                                Te enviamos la factura correspondiente al período
                                <strong th:text="${period}">2026-06</strong>. Encontrás el detalle completo en el PDF adjunto.
                            </p>
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:16px 0; border:1px solid #e4e7eb; border-radius:6px;">
                                <tr>
                                    <td style="padding:16px 20px; font-size:14px; color:#52606d;">Total a pagar</td>
                                    <td style="padding:16px 20px; font-size:18px; font-weight:bold; text-align:right; color:#1f3a93;"
                                        th:text="'$' + ${#numbers.formatDecimal(totalAmount, 1, 'POINT', 2, 'COMMA')}">$0,00</td>
                                </tr>
                            </table>
                            <p style="margin:16px 0 0; font-size:13px; color:#7b8794; line-height:1.5;">
                                Este es un mensaje automático, por favor no respondas a este correo.
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td style="background-color:#f4f5f7; padding:16px 32px; text-align:center; font-size:12px; color:#9aa5b1;">
                            Sistema de gestión de alquileres
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
