spring.config.import=optional:file:.env.properties

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:rent_manager}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update

# Server Configuration
server.port=${SERVER_PORT:8080}
server.address=${SERVER_HOST:localhost}

server.forward-headers-strategy=native

# File Upload Configuration
upload.payments.path=uploads/payments
upload.contracts.path=uploads/contracts
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

